name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.5"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  changes:
    runs-on: ubuntu-latest
    outputs:
      production: ${{ steps.filter.outputs.production }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed production files
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          # No usable base to diff against (e.g. a force-push or the first
          # push of a branch leaves 'before' as all zeros) — build rather
          # than silently skip a release.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no usable base commit; assuming production code changed"
            echo "production=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$base" "${{ github.sha }}" -- '*.go' 'go.mod' 'go.sum' | grep -v '_test\.go$' || true)"
          echo "Changed production files:"
          echo "${changed:-<none>}"

          if [ -n "$changed" ]; then
            echo "production=true" >> "$GITHUB_OUTPUT"
          else
            echo "production=false" >> "$GITHUB_OUTPUT"
          fi

  release-binaries:
    needs: [test, changes]
    if: |
      needs.changes.outputs.production == 'true' &&
      (github.event_name == 'push' || github.event.pull_request.base.ref == 'master')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.5"

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          sha="$(git rev-parse --short HEAD)"
          go build -trimpath -ldflags "-X main.version=$sha" -o "dist/claudenator-${{ matrix.goos }}-${{ matrix.goarch }}" .

      - uses: actions/upload-artifact@v4
        with:
          name: claudenator-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/claudenator-${{ matrix.goos }}-${{ matrix.goarch }}
          # 31 (not 30) so the artifact always survives a full calendar month.
          retention-days: 31

  publish-release:
    needs: release-binaries
    # Only an actual push to master updates the public "latest" release —
    # a PR's binaries stay as workflow artifacts for reviewers, not a
    # published release, until the PR is merged.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: claudenator-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: "Automated build from ${{ github.sha }}."
          make_latest: true
          files: dist/*
